# Automated releases via release-please (conventional commits).
#
# On every push to main, release-please accumulates feat:/fix:/etc. commits
# into a running "release PR" that updates CHANGELOG.md and computes the next
# SemVer. Merging that PR tags the release and publishes the GitHub release
# with the changelog as its notes. The ds-coordination DynamoDB fragment is
# pushed in the same run (tags created with GITHUB_TOKEN cannot trigger a
# separate tag-push workflow).

name: Release

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  push-release-fragment:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-north-1
      DOMAIN: ds
      SERVICE_GROUP: packages
      SERVICE_NAME: go-policy
      ACCOUNT_ID: 999125116186

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Extract Metadata
        id: meta
        run: |
          echo "VERSION=${{ needs.release-please.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          echo "COMMIT_SHA=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Push Release Fragment to DynamoDB
        run: |
          aws dynamodb put-item \
            --table-name ds-coordination-release-fragments-prod \
            --item '{
              "PK": {"S": "${{ steps.meta.outputs.VERSION }}"},
              "SK": {"S": "${{ env.DOMAIN }}#${{ env.SERVICE_GROUP }}#${{ env.SERVICE_NAME }}"},
              "GSI1PK": {"S": "service#${{ env.SERVICE_NAME }}"},
              "GSI1SK": {"S": "${{ steps.meta.outputs.VERSION }}"},
              "GSI2PK": {"S": "latest#${{ env.DOMAIN }}#${{ env.SERVICE_GROUP }}"},
              "GSI2SK": {"S": "${{ env.SERVICE_NAME }}"},
              "domain": {"S": "${{ env.DOMAIN }}"},
              "serviceGroup": {"S": "${{ env.SERVICE_GROUP }}"},
              "serviceName": {"S": "${{ env.SERVICE_NAME }}"},
              "version": {"S": "${{ steps.meta.outputs.VERSION }}"},
              "commit": {"S": "${{ steps.meta.outputs.COMMIT_SHA }}"},
              "artifact": {"S": "${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.DOMAIN }}-${{ env.SERVICE_GROUP }}-${{ env.SERVICE_NAME }}-prod:${{ steps.meta.outputs.VERSION }}"},
              "timestamp": {"S": "${{ steps.meta.outputs.TIMESTAMP }}"}
            }' \
            --region $AWS_REGION
